services:
  - type: web
    name: prd-generator
    runtime: node
    plan: free
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: GROQ_API_KEY
        sync: false
